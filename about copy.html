<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Cloud Sky</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(
      to bottom,
      #2389e8 0%,
      #65b5f5 55%,
      #b9e3ff 100%
    );
    background-attachment: fixed;
  }

  /* Cloud shapes */
  .cloud {
    position: fixed;
    width: 180px;
    height: 55px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 100px;
    filter: blur(1px);
    z-index: -1;
    pointer-events: none;
    animation: drift linear infinite;
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }

  .cloud::before {
    width: 85px;
    height: 85px;
    top: -38px;
    left: 25px;
  }

  .cloud::after {
    width: 110px;
    height: 105px;
    top: -50px;
    right: 20px;
  }

  /* Different cloud positions and speeds */
  .cloud:nth-child(1) {
    top: 15%;
    left: -220px;
    animation-duration: 45s;
  }

  .cloud:nth-child(2) {
    top: 38%;
    left: -280px;
    transform: scale(0.7);
    animation-duration: 65s;
    animation-delay: -25s;
  }

  .cloud:nth-child(3) {
    top: 65%;
    left: -250px;
    transform: scale(1.3);
    animation-duration: 55s;
    animation-delay: -15s;
  }

  .cloud:nth-child(4) {
    top: 85%;
    left: -200px;
    transform: scale(0.6);
    animation-duration: 75s;
    animation-delay: -40s;
  }

  @keyframes drift {
    from {
      left: -300px;
    }
    to {
      left: calc(100vw + 100px);
    }
  }

  /* Keep your website content above the clouds */
  .content {
    position: relative;
    z-index: 1;
    padding: 40px;
  }
</style>
</head>

<body>

  <div class="cloud"></div>
  <div class="cloud"></div>
  <div class="cloud"></div>
  <div class="cloud"></div>

  <div class="content">
    <h1>Your Website</h1>
    <p>Your existing text and images can go here.</p>
  </div>

</body>
</html>
